(function(){var d=document.documentElement,t=null,l=null,q=null;
try{t=localStorage.getItem('ms-theme');l=localStorage.getItem('ms-lang');}catch(e){}

if(q==='en'||q==='tr'){l=q;try{localStorage.setItem('ms-lang',q);}catch(e){}}if(l!=='en')l='tr';

try{document.querySelectorAll('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',t==='dark'?'#0a0c14':'#f4f5f9');});}catch(e){}})();

<script>
(function(){
  var d=document.documentElement,L=d.lang==='en'?'en':'tr';
  var TITLE={tr:'Sayfa bulunamadı (404) | Mehmet Sevri',en:'Page not found (404) | Mehmet Sevri'};
  function q(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
  function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
  function syncTC(){var dk=d.getAttribute('data-theme')==='dark';q('meta[name="theme-color"]').forEach(function(m){m.setAttribute('content',dk?'#0a0c14':'#f4f5f9');});}
  function themeLbl(){var dk=d.getAttribute('data-theme')==='dark',b=document.getElementById('themeBtn');var s=dk?(L==='en'?'Switch to light mode':'Açık temaya geç'):(L==='en'?'Switch to dark mode':'Koyu temaya geç');b.setAttribute('aria-label',s);b.setAttribute('title',s);}
  function apply(){
    d.lang=L;document.title=TITLE[L];
    q('[data-tr]').forEach(function(el){el.textContent=el.getAttribute('data-'+L);});
    q('[data-tr-aria]').forEach(function(el){el.setAttribute('aria-label',el.getAttribute('data-'+L+'-aria'));});
    q('.seg-b').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===L?'true':'false');});
    themeLbl();
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest?e.target.closest('button'):null;if(!b)return;
    var l=b.getAttribute('data-lang');if(l&&l!==L){L=l;store('ms-lang',l);apply();return;}
    if(b.id==='themeBtn'){var th=d.getAttribute('data-theme')==='dark'?'light':'dark';d.setAttribute('data-theme',th);store('ms-theme',th);themeLbl();syncTC();}
  });
  document.getElementById('path').textContent=location.pathname;
  document.getElementById('year').textContent=new Date().getFullYear();
  apply();
})();
</script>
